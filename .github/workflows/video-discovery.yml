name: Video discovery diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/video-discovery.yml'
      - 'src/video_discovery_probe.py'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - name: Probe public channel archive
        run: python src/video_discovery_probe.py
