name: Audit public PLP player profile HTML
on:
  push:
    branches:
      - feat/complete-source-audit-and-portal-2026
    paths:
      - 'src/probe_career_html.py'
      - '.github/workflows/probe-career.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/probe_career_html.py
