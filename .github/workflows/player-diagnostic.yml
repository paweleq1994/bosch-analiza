name: Player season API diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/player-diagnostic.yml'
      - 'src/player_diagnostic.py'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/player_diagnostic.py
