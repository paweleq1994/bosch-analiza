name: Publish verified Bosch downloads
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-downloads.yml'
      - 'src/export_workbook.py'
      - 'src/audit_video_coverage.py'
      - 'src/audit_player_coverage.py'
      - 'src/build_portal.py'
      - 'docs/assets/data.json'
      - 'data/league_updates.json'
      - 'data/match_player_evidence.json'
      - 'data/player_html_career_snapshot.json'
      - 'data/video_updates.json'
permissions:
  contents: write
concurrency:
  group: bosch-publish-offline-downloads
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel builder
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Verify exact already-committed source snapshot
        run: python src/validate_portal.py
      - name: Export downloadable Excel and transparent data quality reports
        run: |
          python src/export_workbook.py
          python src/audit_video_coverage.py
          python src/audit_stat_sources.py
          python src/video_goal_evidence.py
          python src/audit_player_coverage.py
      - name: Verify downloadable workbook is complete
        run: |
          python -m unittest tests/test_excel_export.py -v
          test -s docs/downloads/bosch-kompendium.xlsx
          test -s reports/video-goal-review-queue.md
          test -s reports/video-coverage.md
          test -s reports/player-source-reconciliation.md reports/video-goal-review-queue.md
          test -s reports/player-data-coverage.md
      - name: Publish only validated offline-generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/downloads/bosch-kompendium.xlsx docs/downloads/bosch-kompendium.source.sha256
          git add reports/video-coverage.md reports/player-data-coverage.md reports/player-source-reconciliation.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish verified Bosch Excel and source gap reports'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
