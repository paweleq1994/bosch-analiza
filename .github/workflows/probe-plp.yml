name: Probe PLP match details
on:
  push:
    branches:
      - feat/rebuild-player-stats-from-113-match-reports
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official PLP events
        run: python src/probe_match_html.py
