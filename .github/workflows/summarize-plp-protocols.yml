name: Summarize Bosch match protocol audit

on:
  push:
    branches:
      - audit/all-113-bosch-match-protocols
    paths:
      - 'src/summarize_match_protocol_audit.py'
      - '.github/workflows/summarize-plp-protocols.yml'

permissions:
  contents: write

jobs:
  summarize_match_protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/all-113-bosch-match-protocols
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze each recorded event and every named scorer
        run: python -u src/summarize_match_protocol_audit.py
      - name: Verify all original match references were retained
        run: |
          python -c 'import json;from pathlib import Path;a=json.loads(Path("data/match_protocol_audit_index.json").read_text());assert len(a["matches"])==113;assert len({m["event_url"] for m in a["matches"]})==113;print("LINKS_VERIFIED",len(a["matches"]))'
      - name: Persist source-linked findings on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/match_protocol_audit_summary.json data/match_protocol_audit_findings.json data/match_protocol_audit_index.json
          git commit -m "audit: summarize Bosch match scorers and seasonal discrepancies [skip ci]"
          git push origin HEAD:audit/all-113-bosch-match-protocols
