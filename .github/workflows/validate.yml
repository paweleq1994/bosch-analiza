name: Validate Bosch portal
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PLP synchronization regression tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild portal
        run: python src/build_portal.py
      - name: Validate generated snapshot
        run: python src/validate_portal.py
      - name: Rebuild scouting from versioned sources
        run: python src/build_scouting.py
      - name: Validate scouting reports
        run: python src/validate_scouting.py
      - name: Probe public PLP photo endpoints
        run: |
          python -c "import sys;sys.path.insert(0,'src');from plp_photo_archive import identify;print('PLP player 1960 photos:',len(identify('players','1960')));print('PLP team 6951 photos:',len(identify('teams','6951')))"
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/scouting.js
          node --check docs/assets/table-sort.js
      - name: Verify player season filtering
        run: node tests/frontend_player_filter.cjs
      - name: Verify advanced sort and Bosch records
        run: node tests/frontend_records_sort.cjs
      - name: Verify every table is sortable and season leaders are correct
        run: node tests/frontend_all_tables_sort.cjs
      - name: Check every archived player season in the frontend
        run: node tests/frontend_archived_player_seasons.cjs
      - name: Verify sourced scorer reconciliation and walkover UI
        run: node tests/frontend_goal_reconciliation.cjs
      - name: Verify all 113 PLP match protocols across portal views
        run: node tests/frontend_full_match_protocols.cjs
      - name: Check required portal paths
        run: |
          test -s docs/index.html
          test -s docs/archive.html
          test -s docs/assets/style.css
          test -s docs/assets/data.json
          test -s docs/photos.html
          test -s docs/scouting.html
          test -s docs/assets/scouting.json
