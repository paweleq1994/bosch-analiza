name: Validate Bosch portal
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Excel exporter
        run: python -m pip install "openpyxl==3.1.5"
      - name: PLP synchronization regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify archive can grow beyond the original 113 games
        run: python -m unittest tests/test_archive_growth.py -v
      - name: Validate player match evidence
        run: python -m unittest discover -s tests -p 'test_match_player_evidence.py' -v
      - name: Rebuild portal
        run: python src/build_portal.py
      - name: Export source-linked XLSX
        run: python src/export_workbook.py
      - name: Verify complete public video coverage report
        run: python src/audit_video_coverage.py
      - name: Audit every career HTML versus REST and match source discrepancy
        run: python src/audit_source_reconciliation.py
      - name: Validate generated snapshot
        run: python src/validate_portal.py
      - name: Compare every player and season against official match sources
        run: python src/audit_stat_sources.py
      - name: Audit incomplete player coverage
        run: python src/audit_player_coverage.py
      - name: Validate audit report
        run: python -m unittest tests/test_player_coverage_report.py -v
      - name: Rebuild scouting from versioned sources
        run: python src/build_scouting.py
      - name: Validate scouting reports
        run: python src/validate_scouting.py
      - name: Probe public PLP photo endpoints
        run: |
          python -c "import sys;sys.path.insert(0,'src');from plp_photo_archive import identify;print('PLP player 1960 photos:',len(identify('players','1960')));print('PLP team 6951 photos:',len(identify('teams','6951')))"
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/scouting.js
          node --check docs/assets/table-sort.js
      - name: Verify source-proven YouTube goal jump links
        run: node tests/frontend_video_goal_timestamps.cjs
      - name: Verify source-linked player fields and status
        run: node tests/frontend_source_provenance.cjs
      - name: Verify full PLP match box scores and player comparisons
        run: node tests/frontend_match_boxscores.cjs
      - name: Verify sortable tables without CSV controls
        run: node tests/frontend_csv_exports.cjs
      - name: Verify historical team photo evidence cannot be confused with portraits
        run: node tests/frontend_historic_team_photos.cjs
      - name: Verify player season charts and XLSX download link
        run: node tests/frontend_player_trends.cjs
      - name: Verify historical form, goal-minute and footage coverage analytics
        run: node tests/frontend_historical_form.cjs
      - name: Verify source-canonical rivals and honest statistics rankings
        run: node tests/frontend_rivals_quality.cjs
      - name: Verify scouting match archives and opponent selection
        run: node tests/frontend_scouting_archive.cjs
      - name: Verify player season filtering
        run: node tests/frontend_player_filter.cjs
      - name: Verify advanced sort and Bosch records
        run: node tests/frontend_records_sort.cjs
      - name: Verify every table is sortable and season leaders are correct
        run: node tests/frontend_all_tables_sort.cjs
      - name: Check every archived player season in the frontend
        run: node tests/frontend_archived_player_seasons.cjs
      - name: Verify sourced scorer reconciliation and walkover UI
        run: node tests/frontend_goal_reconciliation.cjs
      - name: Verify complete goal history in every portal view
        run: node tests/frontend_full_match_protocols.cjs
      - name: Check required portal paths
        run: |
          test -s docs/index.html
          test -s docs/archive.html
          test -s docs/assets/style.css
          test -s docs/assets/data.json
          test -s docs/photos.html
          test -s docs/scouting.html
          test -s docs/assets/scouting.json
