name: Probe public PLP identity endpoints
on:
  push:
    branches:
      - feat/verified-player-identity-discovery-20261019
    paths:
      - 'src/probe_plp_identity_endpoints.py'
      - '.github/workflows/probe-plp-identities.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect publicly available source representations
        run: python src/probe_plp_identity_endpoints.py
