name: Bosch data sync
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'src/sync_videos.py'
      - 'src/sync_plp.py'
      - 'src/sync_scouting.py'
      - 'src/sync_scouting_details.py'
      - 'src/build_portal.py'
      - 'src/plp_photo_archive.py'
      - 'src/sync_player_seasons.py'
      - 'src/resolve_current_players.py'
      - 'src/player_identity.py'
      - 'src/player_totals.py'
      - 'src/dedupe_portal.py'
      - 'src/build_scouting.py'
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bosch-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public YouTube metadata reader
        run: python -m pip install "yt-dlp>=2026.9.1"
      - name: Scan official PLP league data
        run: python src/sync_plp.py
      - name: Scan known public YouTube channels
        run: python src/sync_videos.py
      - name: Resolve public player profiles for current leaders
        run: python src/resolve_current_players.py
      - name: Refresh historical player season statistics
        run: python src/sync_player_seasons.py
      - name: Rebuild portal data
        run: python src/build_portal.py
      - name: Refresh historical PLP photo archive
        run: python src/plp_photo_archive.py
      - name: Rebuild portal including media manifest
        run: python src/build_portal.py
      - name: Refresh rival PLP tables
        run: python src/sync_scouting.py
      - name: Sync opponent match and player stats
        run: python src/sync_scouting_details.py
      - name: Generate scouting reports
        run: python src/build_scouting.py
      - name: Validate scouting reports
        run: python src/validate_scouting.py
      - name: Validate generated portal data
        run: python src/validate_portal.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Commit verified data changes
        run: |
          if ! git diff --quiet -- data/video_updates.json data/league_updates.json data/scouting_updates.json docs/assets/data.json docs/assets/scouting.json data/scouting_details.json data/player_profile_map.json data/player_season_updates.json data/player_career_updates.json data/media_manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/video_updates.json data/league_updates.json data/scouting_updates.json data/scouting_details.json data/player_profile_map.json data/player_season_updates.json data/player_career_updates.json data/media_manifest.json docs/assets/data.json docs/assets/scouting.json docs/media
            git commit -m "chore: sync Bosch video and portal data"
            git push
          fi

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static site
        id: deployment
        uses: actions/deploy-pages@v4
