name: Bosch data sync
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'src/sync_videos.py'
      - 'src/audit_video_coverage.py'
      - 'src/sync_plp.py'
      - 'src/sync_scouting.py'
      - 'src/sync_scouting_details.py'
      - 'src/build_portal.py'
      - 'src/protocol_goals.py'
      - 'src/sync_new_goal_protocols.py'
      - 'data/pending_goal_protocols.json'
      - 'src/backfill_match_player_stats.py'
      - 'src/collect_match_player_evidence.py'
      - 'data/match_player_evidence.json'
      - 'data/bosch_own_goal_evidence.json'
      - 'src/goal_reconciliation.py'
      - 'data/goal_evidence.json'
      - 'src/plp_photo_archive.py'
      - 'src/plp_media_discovery.py'
      - 'src/sync_player_seasons.py'
      - 'src/sync_public_player_careers.py'
      - 'data/player_html_career_snapshot.json'
      - 'src/resolve_match_player_identities.py'
      - 'src/integrate_verified_match_players.py'
      - 'data/match_player_identities.json'
      - 'src/resolve_current_players.py'
      - 'src/player_identity.py'
      - 'src/player_totals.py'
      - 'src/dedupe_portal.py'
      - 'src/build_scouting.py'
      - 'src/scouting_strength.py'
      - 'src/sync_scouting_players.py'
      - 'data/scouting_player_overrides.json'
      - 'docs/assets/app.js'
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: bosch-data-sync-v2
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public YouTube metadata reader
        run: python -m pip install "yt-dlp>=2026.9.1"
      - name: Install source-linked Excel exporter
        run: python -m pip install "openpyxl==3.1.5"
      - name: Scan official PLP league data
        run: python src/sync_plp.py
      - name: Refresh 113 historical and newly discovered official PLP box scores
        run: python src/collect_match_player_evidence.py
      - name: Scan known public YouTube channels
        run: python src/sync_videos.py
      - name: Resolve public player profiles for current leaders
        run: python src/resolve_current_players.py
      - name: Resolve official players from source-linked match HTML
        run: python src/resolve_match_player_identities.py
      - name: Verify scorer minutes and goals for newly discovered fixtures
        run: python src/sync_new_goal_protocols.py
      - name: Refresh historical player season statistics
        run: python src/sync_player_seasons.py
      - name: Verify public player career HTML independent of API
        run: python src/sync_public_player_careers.py
      - name: Rebuild portal data
        run: python src/build_portal.py
      - name: Search detached public PLP media archive
        run: python src/plp_media_discovery.py
      - name: Refresh historical PLP photo archive
        run: python src/plp_photo_archive.py
      - name: Rebuild portal including media manifest
        run: python src/build_portal.py
      - name: Audit linked and missing footage across every Bosch season
        run: python src/audit_video_coverage.py
      - name: Refresh rival PLP tables
        run: python src/sync_scouting.py
      - name: Sync opponent match and player stats
        run: python src/sync_scouting_details.py
      - name: Refresh named player statistics for opponent teams
        run: python src/sync_scouting_players.py
      - name: Generate scouting reports
        run: python src/build_scouting.py
      - name: Validate scouting reports
        run: python src/validate_scouting.py
      - name: Build complete Excel archive from sourced portal snapshot
        run: python src/export_workbook.py
      - name: Validate generated portal data
        run: python src/validate_portal.py
      - name: Audit incomplete player careers, appearances, assists, cards, MVP and photos
        run: python src/audit_player_coverage.py
      - name: Commit verified data changes
        run: |
          if ! git diff --quiet -- data/video_updates.json data/league_updates.json data/match_player_evidence.json data/match_protocol_audit_index.json data/pending_goal_protocols.json data/scouting_updates.json docs/assets/data.json docs/assets/scouting.json data/scouting_details.json data/player_profile_map.json data/match_player_identities.json data/player_season_updates.json data/player_career_updates.json data/player_html_career_snapshot.json data/media_manifest.json data/media_discovery.json data/scouting_player_updates.json reports/player-data-coverage.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/video_updates.json data/league_updates.json data/scouting_updates.json data/scouting_details.json data/player_profile_map.json data/player_season_updates.json data/player_career_updates.json data/player_html_career_snapshot.json data/media_manifest.json data/media_discovery.json data/scouting_player_updates.json docs/assets/data.json docs/assets/scouting.json reports/player-data-coverage.md reports/video-coverage.md docs/media docs/downloads/bosch-kompendium.xlsx docs/downloads/bosch-kompendium.source.sha256
            git commit -m "chore: sync Bosch video and portal data"
            git push
          fi

